### Deployments, svc, svcAccount available in samples/bookinfo/platform/kube/bookinginfo.yml

##DestinationRule
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: dst1
spec:
  host: reviews
  subsets:
    - name: v1
      labels:
        version: v1

    - name: v2
      labels:
        version: v2

    - name: v3
      labels:
        version: v3



##VirtualServer
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: vs1
spec:
  hosts:
    - reviews
  http:
    - route:
        - destination:
            host: reviews
            subset: v1
          weight: 80

        - destination:
            host: reviews
            subset: v2
          weight: 20

        - destination:
            host: reviews
            subset: v3
          weight: 0
