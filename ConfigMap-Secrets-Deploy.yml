###Deploy with ConfigMap and secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dply4
  namespace: dev
spec:
  selector:
    matchLabels:
      app: makeup
      env: dev
  replicas: 3
  template:
    metadata:
      name: tmplt1
      labels:
        app: makeup
        env: dev
    spec:
      containers:
        - image: apsanadevops/beauty:makeup
          name: con-1
          ports:
            - containerPort: 80

          envFrom:
            - secretRef:
                name: sec1
            - secretRef:
                name: sec2

            - configMapRef:
                name: cm1

            - configMapRef:
                name: cm2

          env:
            - name: env1
              valueFrom:
                configMapKeyRef:
                  name: cm3
                  key: app
            - name: env2
              valueFrom:
                configMapKeyRef:
                  name: cm4
                  key: app
            - name: env3
              valueFrom:
                secretKeyRef:
                  name: sec3
                  key: user2
            - name: env4
              valueFrom:
                secretKeyRef:
                  name: sec4
                  key: user3



